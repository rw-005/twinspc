name: Build EXE (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'main.js', 'preload.js', 'raw-print.ps1', 'package.json']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TWINS-POS-Setup
          path: dist/*.exe
