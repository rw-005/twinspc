html:not(.ready)::after{content:"TWINS POS";position:fixed;left:0;right:0;top:50%;margin-top:84px;text-align:center;color:#fff;font:700 15px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.32em;z-index:99999}
html:not(.ready) body{visibility:hidden}
.wk .disc,.wk #cbtn,.wk #sbtn,.wk #kbtn,.wk #soBtn,.wk .navsvc{display:none!important}
.wk #wstat.ok{color:#bff5d0}.wk #wstat.bad{color:#ffd9a8}
@media (min-width:1000px) and (min-height:640px){
 :root{--bg:#f1f2f4;--bd:#e5e7eb;--sh:0 1px 3px rgba(17,24,39,.08);--mut:#6b7280;--tx:#111827}
 body{background:var(--bg)}
 .shell:not(.wk) .topbar{background:var(--pri);border-radius:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
 .shell:not(.wk) header{padding:8px 16px}
 .shell:not(.wk) .prod{border:1px solid var(--bd);box-shadow:var(--sh);border-radius:10px}
 .shell:not(.wk) .prod .ph{background:#eceef1;color:#6b7280;border-radius:0}
 .shell:not(.wk) .prod .pb b{color:#111827;font-weight:700}
 .shell:not(.wk) .prod .pr{color:#6b7280;font-weight:600}
 .shell:not(.wk) .prod .pr small{color:#9ca3af;font-weight:500}
 .shell:not(.wk) .prod .stb{position:absolute;left:8px;top:8px;right:auto;bottom:auto;background:rgba(55,65,81,.62);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px}
 .shell:not(.wk) .prod.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
 .shell:not(.wk) .cart{border-radius:0;box-shadow:none;border-left:1px solid var(--bd)}
 .shell:not(.wk) .payrow{margin:10px -12px -12px;gap:0}
 .shell:not(.wk) .payrow #saveBtn{flex:1 1 50%;min-height:54px;border:0;border-top:1px solid var(--bd);border-radius:0;background:#fff;color:var(--pri);font-weight:700;box-shadow:none}
 .shell:not(.wk) .payrow #ordBtn{flex:1 1 50%;min-height:54px;border:0;border-top:1px solid var(--bd);border-left:1px solid var(--bd);border-radius:0;background:#fff;color:var(--pri);font-weight:700;box-shadow:none}
 .shell:not(.wk) .payrow #kbtn2{flex:1 1 50%;border-top:1px solid var(--bd);border-left:1px solid var(--bd);gap:0}
 .shell:not(.wk) .payrow #kbtn2 .btn{min-height:54px;border:0;border-radius:0;background:#fff;color:var(--pri);box-shadow:none}
 .shell:not(.wk) .payrow #payBtn{flex:1 1 100%;min-height:64px;border-radius:0;font-size:20px;text-align:left;padding:0 22px}
}

@media (min-width:1000px) and (min-height:640px){
 .left.rail.railmin>#cats{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:6px 4px}
 .left.railmin>#cats .chip{border:0;box-shadow:none;border-radius:8px;color:#374151}
 .left.railmin>#cats .chip.on{background:var(--soft);color:var(--pri)}
}

.lock2{height:100%;overflow:auto;background:var(--card);color:var(--tx);display:flex;justify-content:center;padding:18px 20px}
.lk2in{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;margin:auto 0;position:relative}
.lk2top{text-align:center;padding:6px 0}.lk2logo{font-weight:800;font-size:26px;letter-spacing:.3em;color:var(--tx)}.lk2logo span{font-weight:600;margin-left:.3em;color:var(--pri)}
.lk2row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lk2out{display:flex;align-items:center;gap:12px;min-width:0}.lk2out img{width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);object-fit:cover;flex:none;background:#fff}
.lk2out b{display:block;font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk2out small{color:var(--mut);font-size:13.5px}
.lk2lang{position:relative;flex:none}.lk2chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px}
.lk2menu{display:none;position:absolute;right:0;top:46px;z-index:9;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);min-width:170px;overflow:hidden}.lk2menu.on{display:block}
.lk2menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:15px;color:var(--tx);background:none}.lk2menu button.on{background:var(--soft);color:var(--pri);font-weight:700}
.lk2sel{width:100%;height:54px;border:1px solid var(--bd);border-radius:12px;padding:0 16px;font-size:17px;background:var(--card);color:var(--tx)}
.lk2pin{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 2px}
.lkdots{display:flex;gap:18px;justify-content:center;padding:6px 0}.lkdots i{width:15px;height:15px;border-radius:50%;background:#d5dae4;transition:.12s}.lkdots i.on{background:var(--pri);transform:scale(1.15)}
.lk2hint{font-size:15px;color:var(--tx)}.lk2pin .err{min-height:20px}.lk2pin #lk_mw{width:100%;text-align:left}.lk2go{width:100%;max-width:300px}
.lk2pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px;margin:4px auto 0}
.lk2pad button{height:68px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:26px;font-weight:500}.lk2pad button:active{background:var(--soft)}.lk2pad button.sm{font-size:15px;border:0;color:var(--mut)}
.lk2th{align-self:center;font-size:13px}
@media (orientation:landscape) and (min-width:760px){.lk2in{max-width:900px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px;align-items:center}.lk2top,.lk2row,.lk2sel,.lk2pin{grid-column:1}.lk2pad{grid-column:2;grid-row:1/6;align-self:center}.lk2th{grid-column:1}}
@media (max-width:480px){.lock2{padding:10px 16px}.lk2in{gap:8px}.lk2top{padding:0}.lk2pad{gap:8px}.lk2pad button{height:56px;font-size:23px}.lk2pin{gap:6px;padding:2px 0}.lk2sel{height:48px}.lk2go{max-width:none}}

#kds{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}#kds.on{display:flex}
.kdh{display:flex;align-items:center;gap:14px;padding:12px 16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;flex-wrap:wrap}.kdh>b{font-size:20px;font-weight:800}
.kdst{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18)}.kdst.bad{background:#e5384f}
.kdt{display:flex;gap:8px;margin-left:8px}.kdt button{border:0;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.14)}.kdt button.on{background:#fff;color:var(--pri)}.kdt em{font-style:normal;margin-left:6px;opacity:.85}
.kdr{margin-left:auto;display:flex;gap:8px}.kdr .btn{color:var(--tx);background:#fff;border-color:transparent}
#kdsg{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-content:start}
.kdc{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--pri);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.kdc{border-top-width:8px}.kdc.new{border-top-color:#2563eb;background:color-mix(in srgb,#2563eb 6%,var(--card))}.kdc.cook{border-top-color:#e08a00;background:color-mix(in srgb,#e08a00 9%,var(--card))}.kdc.ready{border-top-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.kdc.done{border-top-color:#6b7280;opacity:.7}
.kdtl{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}.kdtl button{flex:1;min-width:118px;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 12px;font:inherit;cursor:pointer}.kdtl button b{display:block;font-size:24px;line-height:1.05;font-weight:800}.kdtl button span{font-size:12.5px;font-weight:700;color:var(--mut)}
.kdtl button.on{color:#fff}.kdtl button.on span{color:#ffffffd0}.kdtl .k-all.on{background:#374151;border-color:#374151}.kdtl .k-new{border-color:#2563eb}.kdtl .k-new.on{background:#2563eb}.kdtl .k-cook{border-color:#e08a00}.kdtl .k-cook.on{background:#e08a00}.kdtl .k-ready{border-color:var(--ok)}.kdtl .k-ready.on{background:var(--ok)}.kdtl .k-done{border-color:#6b7280}.kdtl .k-done.on{background:#6b7280}
.kdbd{display:inline-block;font-size:12px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px;margin-right:6px}.kdbd.new{background:#2563eb}.kdbd.cook{background:#e08a00}.kdbd.ready{background:var(--ok)}.kdbd.done{background:#6b7280}
.kdsb{margin-left:auto;align-self:center;font-size:11.5px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px;flex:none}
.kdi{border:2px solid #2563eb;background:var(--card)}.kdi .kdsb{background:#2563eb}.kdi.s1{border-color:#e08a00;background:color-mix(in srgb,#e08a00 16%,var(--card))}.kdi.s1 .kdsb{background:#e08a00}.kdi.s2{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}.kdi.s2 .kdsb{background:var(--ok)}.kdi.s2 .kdn,.kdi.s2 .kdq{text-decoration:line-through;opacity:.6}
.kdci{gap:6px}.kdc button.kdb-cook{background:#e08a00;border-color:#e08a00;color:#fff}.kdc button.kdb-ready{background:var(--ok);border-color:var(--ok);color:#fff}.kdc button.kdb-done{background:#374151;border-color:#374151;color:#fff}
.kdch{display:flex;justify-content:space-between;align-items:center;gap:8px}.kdch b{font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kdtm{font-size:15px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft,#eef1f8);flex:none}.kdc.late .kdtm{background:var(--bad);color:#fff}.kdc.warn .kdtm{background:#e08a00;color:#fff}
.kdcs{font-size:13.5px;color:var(--mut)}.kdcs em{font-style:normal;font-weight:800;color:#fff;background:var(--bad);border-radius:6px;padding:1px 7px;font-size:12px}
.kdci{display:flex;flex-direction:column;gap:2px;flex:1}.kdi{display:flex;gap:10px;padding:9px 6px;border-radius:10px;font-size:18px;cursor:pointer;align-items:flex-start}.kdi:active{background:var(--soft,#eef1f8)}.kdq{font-weight:800;min-width:36px;color:var(--pri)}.kdn{font-weight:600;line-height:1.25}.kdn small{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-top:2px}
.kdem{grid-column:1/-1;text-align:center;color:var(--mut);padding:70px 10px;font-size:18px}
@media (max-width:640px){#kdsg{grid-template-columns:1fr;padding:10px}.kdh{padding:10px}}

<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0b1630;--mut:#6b7893;--pri:#2457f5;--pri2:#1a44cc;--soft:#eaf0ff;--bd:#e3e8f3;--ok:#12a150;--bad:#e5384f;--warn:#d98a06;--sh:0 6px 24px rgba(20,40,100,.08);--r:16px;--hd1:#1a44cc;--hd2:#2f6df5}
[data-theme=dark]{--bg:#070b16;--card:#0f1627;--tx:#e8edf9;--mut:#93a1bd;--pri:#5b8cff;--pri2:#4474ee;--soft:#16223d;--bd:#1d2a45;--sh:0 6px 24px rgba(0,0,0,.35);--hd1:#10265e;--hd2:#1d44a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;min-height:48px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
label{display:block;font-size:13.5px;color:var(--mut);margin:14px 0 6px;font-weight:600}
svg{flex-shrink:0;vertical-align:middle}
.mut{color:var(--mut)}.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.rcb{font-size:2em;line-height:1.2}
.logo{font-weight:800;font-size:28px;letter-spacing:.2em;color:var(--pri)}.logo span{color:var(--tx);font-weight:300;margin-left:.3em;letter-spacing:.14em}
.logo.sm{color:#fff;font-size:23px;font-weight:700;letter-spacing:.36em;margin-right:-.36em;white-space:nowrap;text-align:center}.logo.sm span{color:#dbe6ff;font-weight:300;letter-spacing:.36em;margin-left:.45em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--bd);background:var(--card);padding:12px 20px;min-height:50px;font-size:16px;border-radius:14px;font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(36,87,245,.28)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:10px 16px;min-height:46px;font-size:15px;border-radius:12px}.btn.big{width:100%;padding:17px;font-size:17.5px;margin-top:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.ib{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);display:inline-grid;place-items:center;padding:0}
.link{background:none;border:0;color:var(--mut);margin-top:10px;width:100%}
em{font-style:normal}
#app{height:100%}
.lock{height:100%;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
.lockbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px;text-align:center;box-shadow:var(--sh)}
.lockbox label{text-align:left}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 18px 6px;background:none;color:#fff}.topbar{background:linear-gradient(135deg,var(--hd1),var(--hd2));border-radius:0 0 26px 26px;box-shadow:0 10px 28px rgba(26,68,204,.3);position:relative;z-index:5;flex-shrink:0}.hl{min-width:0;font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.3}.hl b{color:#fff;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:8px 14px 14px;background:none}.nav::-webkit-scrollbar{display:none}
.nv{display:inline-flex;align-items:center;gap:9px;border:0;background:transparent;color:rgba(255,255,255,.86);padding:13px 22px;min-height:52px;font-size:16.5px;border-radius:14px;font-weight:600;white-space:nowrap;position:relative}
.nv.on{background:#fff;color:#1a44cc;box-shadow:0 6px 16px rgba(0,0,50,.25)}
.nv em{background:#ffcf40;color:#3a2a00;border-radius:99px;font-size:12.5px;padding:1px 8px;font-weight:700}
.hr{display:flex;gap:10px;align-items:center;justify-self:end}header .ib{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32);color:#fff}header .btn.bad{background:#fff;border-color:#fff;color:var(--bad);box-shadow:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 410px;gap:14px;padding:14px}
.left{overflow:auto;min-width:0;padding-right:2px}
.catx,#catbtn,.chip .ci{display:none}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.catpick .btn{flex:1 1 140px;min-height:48px;font-weight:600}
@media (min-width:1100px){
 .left.rail.railmin{grid-template-columns:62px minmax(0,1fr)}
 .left.railmin>#cats{padding-right:4px}
 .left.railmin>#cats .chip{padding:0;text-align:center;min-height:46px;font-size:14px;letter-spacing:.2px;display:flex;align-items:center;justify-content:center}
 .left.railmin>#cats .chip .cf{display:none}.left.railmin>#cats .chip .ci{display:inline}
 .left.railmin .catx{padding:0;justify-content:center;font-size:18px;min-height:40px}
 .left.rail .catx{display:flex;align-items:center;gap:6px;border:1px dashed var(--bd);background:transparent;border-radius:12px;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600;color:var(--mut,#6b7a99);width:100%}
 .left.rail{display:grid;grid-template-columns:168px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:14px;row-gap:0;overflow:hidden;padding-right:0}
 .left.rail>#promo,.left.rail>.vtop{grid-column:1/-1}
 .left.rail>#cats{grid-column:1;grid-row:3;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;padding:10px 6px 10px 0;gap:8px;min-height:0}
 .left.rail>#cats .chip{border-radius:14px;text-align:left;white-space:normal;line-height:1.25;padding:13px 16px;min-height:50px;width:100%}
 .left.rail>#grid{grid-column:2;grid-row:3;overflow:auto;min-height:0;align-content:start;grid-auto-rows:max-content;padding-top:10px}
}
.promo{background:linear-gradient(90deg,#fff3d1,#ffe6b0);color:#7a4a00;border-radius:12px;padding:9px 13px;margin-bottom:10px;font-weight:600;font-size:13px}
.sbox{position:relative}.sbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut)}.sbox input{padding-left:46px}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:12px 22px;min-height:48px;white-space:nowrap;font-weight:600;font-size:15.5px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;box-shadow:var(--sh);transition:transform .1s}
.prod:active{transform:scale(.97)}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--soft),var(--bd));display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--pri)}
.ph img{width:100%;height:100%;object-fit:cover}
.pb{padding:10px 12px 12px}.pb b{display:block;font-size:15.5px;line-height:1.25;min-height:39px}
.pr{color:var(--pri);font-weight:800;margin-top:2px;font-size:16px}.pr small,.pb small{color:var(--mut);font-weight:500}
.stk.low{color:var(--bad)!important}
.cart{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;padding:12px}
.chead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ord{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:12px;padding:14px 16px;font-size:15.5px;font-weight:600;color:var(--pri);text-align:left;min-width:0}
.ord span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ord em{margin-left:auto;background:var(--pri);color:#fff;font-size:10px;padding:2px 7px;border-radius:99px}
.lines{flex:1;overflow:auto;min-height:0}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--bd)}

/* ---------- promo & calc ---------- */
/* Promo, voucher & poin: datanya diatur di Backoffice dan ikut tersinkron ke sini (db.promos) */
const dayKey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function promoLive(x){
 if(!x||!x.active)return false;
 const n=new Date(),k=dayKey(n),t=p2(n.getHours())+':'+p2(n.getMinutes());
 if(x.start&&k<x.start)return false;if(x.end&&k>x.end)return false;
 if(x.days&&x.days.length&&!x.days.includes(n.getDay()))return false;
 if(x.tStart&&x.tEnd&&x.tStart!==x.tEnd){const ok=x.tStart<x.tEnd?(t>=x.tStart&&t<x.tEnd):(t>=x.tStart||t<x.tEnd);if(!ok)return false}
 return true;
}
function exTxt(x){const n=((x.exProd||[]).length)+((x.exCat||[]).length);return n?' · kecuali '+n:''}
function activePromos(){return(db.promos||[]).filter(x=>(x.kind||'auto')==='auto'&&promoLive(x))}
function promoEx(x,l){return(Array.isArray(x.exProd)&&x.exProd.indexOf(l.pid)>=0)||(Array.isArray(x.exCat)&&x.exCat.length>0&&x.exCat.indexOf(l.cat||catOf(l.pid))>=0)}
function elSub(x,items){return Math.round(sum(items,i=>promoEx(x,i)?0:i.qty*i.price))}
function elBase(x,items,rem,cap){let b=0;items.forEach((l,k)=>{if(!promoEx(x,l))b+=rem[k]});return Math.max(0,Math.min(b,cap))}
function promoCut(x,base,qty){
 let v=x.type==='percent'?base*(+x.value||0)/100:(+x.value||0)*(x.scope==='all'||!x.scope?1:qty);
 if(+x.maxDisc>0)v=Math.min(v,+x.maxDisc);
 return Math.max(0,Math.min(v,base));
}
function vchFind(code){code=String(code||'').trim().toUpperCase();return(db.promos||[]).find(x=>x.kind==='voucher'&&String(x.code||'').toUpperCase()===code)}
function vchUsed(code){code=String(code||'').toUpperCase();return db.tx.filter(t=>t.status!=='void'&&String(t.voucher||'').toUpperCase()===code).length}
function vchCheck(code,sub,items){
 const v=vchFind(code);if(!v)return{err:'Kode voucher tidak ditemukan'};
 if(!v.active)return{err:'Voucher tidak aktif'};
 const n=dayKey(new Date());
 if(v.start&&n<v.start)return{err:'Voucher belum berlaku (mulai '+v.start+')'};
 if(v.end&&n>v.end)return{err:'Voucher sudah berakhir'};
 if(!promoLive(v))return{err:'Voucher tidak berlaku di hari/jam ini'};
 if(items&&((v.exProd&&v.exProd.length)||(v.exCat&&v.exCat.length))){sub=elSub(v,items);if(!(sub>0))return{err:'Voucher tidak berlaku untuk produk di keranjang'}}
 if((+v.minBuy||0)>sub)return{err:'Minimal belanja '+rp(v.minBuy)};
 if(+v.quota>0&&vchUsed(v.code)>=+v.quota)return{err:'Kuota voucher sudah habis'};
 return{ok:1,v};
}
function loyalty(){const l=(db.promos||[]).find(x=>x.kind==='loyalty');return(l&&l.active&&+l.earnPer>0&&+l.pointValue>0)?l:null}
function ptBalance(id){return Math.max(0,sum(db.tx.filter(t=>t.customerId===id&&t.status!=='void'),t=>(+t.ptEarn||0)-(+t.ptUsed||0)))}
function roundAmt(x){const u=+db.settings.roundUnit||0;if(!u)return x;const m=db.settings.roundMode;return m==='up'?Math.ceil(x/u)*u:m==='down'?Math.floor(x/u)*u:Math.round(x/u)*u}
function calc(items,manual,type,o){
 o=o||{};
 const st=db.settings;
 const sub=Math.round(sum(items,i=>i.qty*i.price)),qty=sum(items,i=>i.qty);
 let auto=0;const names=[];
 const rem=items.map(i=>i.qty*i.price),live=activePromos();
 /* 1. promo per produk / kategori (boleh bertumpuk) */
 live.filter(x=>x.scope==='product'||x.scope==='cat').forEach(x=>{
  if((+x.minBuy||0)>elSub(x,items))return;
  const part=items.map((l,k)=>{const hit=x.scope==='product'?(Array.isArray(x.productIds)&&x.productIds.length?x.productIds.indexOf(l.pid)>=0:l.pid===x.productId):((l.cat||catOf(l.pid))===x.cat&&!promoEx(x,l));return hit?promoCut(x,rem[k],l.qty):0});
  let v=sum(part,a=>a);if(!(v>0))return;
  if(+x.maxDisc>0&&v>+x.maxDisc){const f=+x.maxDisc/v;part.forEach((a,k)=>part[k]=a*f);v=+x.maxDisc}
  part.forEach((a,k)=>rem[k]-=a);auto+=v;names.push(x.name);
 });
 /* 2. promo per total belanja: hanya satu yang paling menguntungkan */
 let best=null,bv=0;
 live.filter(x=>x.scope==='all'||!x.scope).forEach(x=>{if((+x.minBuy||0)>elSub(x,items))return;const v=promoCut(x,elBase(x,items,rem,Math.max(0,sub-auto)),qty);if(v>bv){bv=v;best=x}});
 if(best){auto+=bv;names.push(best.name)}
 auto=Math.min(Math.round(auto),sub);
 /* 3. voucher */
 let vch=0,vcode='';
 if(!o.nov&&S.voucher){const r=vchCheck(S.voucher,sub,items);if(r.ok){vch=Math.round(promoCut({...r.v,scope:'all'},elBase(r.v,items,rem,Math.max(0,sub-auto)),qty));vcode=r.v.code}}
 /* 4. tukar poin */
 let pt=0,ptUsed=0;const L=loyalty(),cu=custOf();
 if(!o.nov&&L&&cu&&S.pts>0){
  const left=Math.max(0,sub-auto-vch),cap=Math.floor(left*Math.min(100,+L.maxPct||100)/100/L.pointValue);
  ptUsed=Math.max(0,Math.min(Math.floor(S.pts),ptBalance(cu.id),cap));
  if(ptUsed<(+L.minRedeem||0))ptUsed=0;
  pt=Math.round(ptUsed*L.pointValue);
 }
 /* 5. diskon manual kasir */
 const b0=sub-auto-vch-pt;
 let man=manual.type==='pct'?Math.round(b0*Math.min(manual.val||0,100)/100):Math.min(Math.round(manual.val||0),b0);
 man=Math.max(0,man);
 const net=Math.max(0,b0-man);
 const sp=+st.servicePct||0,tp=+st.taxPct||0,incl=st.taxMode==='incl';
 const svc=(sp>0&&(!st.serviceDineOnly||type==='dine'))?Math.round(net*sp/100):0;
 const base=net+svc;
 const tax=tp>0?(incl?Math.round(base*tp/(100+tp)):Math.round(base*tp/100)):0;
 const raw=base+(incl?0:tax);
 const total=Math.max(0,roundAmt(raw));
 return{sub,auto,names,vch,vcode,pt,ptUsed,man,net,svc,svcPct:svc?sp:0,tax,taxPct:tax?tp:0,taxIncl:incl,rounding:total-raw,total};
}
const vpL=(c,cls)=>(c.vch?`<div${cls}><span>Voucher ${esc(c.vcode)}</span><span>-${rp(c.vch)}</span></div>`:'')+(c.pt?`<div${cls}><span>Poin (${c.ptUsed})</span><span>-${rp(c.pt)}</span></div>`:'');

/* ---------- komplimen & biaya (MDR / platform) ---------- */
const compRatio=t=>t.total>0?Math.min(1,(t.compAmt||0)/t.total):0;
const feeNet=t=>(t.feeTot||0)*(1-Math.min(1,(t.refunded||0)/(t.total||1)));
function defFees(){const m=()=>({pct:0,flat:0}),h=()=>({svc:0,adm:0,ship:0});return{mdr:{qris:m(),debit:m(),kredit:m(),transfer:m(),ewallet:m()},chan:{shopee:h(),grab:h(),gofood:h()}}}
function feeCfg(){const d=defFees(),f=db.settings.fees||{},o={mdr:{},chan:{}};Object.keys(d.mdr).forEach(k=>o.mdr[k]={...d.mdr[k],...((f.mdr||{})[k]||{})});Object.keys(d.chan).forEach(k=>o.chan[k]={...d.chan[k],...((f.chan||{})[k]||{})});return o}
function calcFees(c,pays,type,channel,ratio){
 const F=feeCfg(),o={mdr:0,svc:0,adm:0,ship:0};
 const pm={};
 pays.forEach(p=>{const m=F.mdr[p.m]||pmxOf(p.m);if(m&&p.ap>0){const v=p.ap*(+m.pct||0)/100+(+m.flat||0);if(m.kind==='svc')o.svc+=v;else o.mdr+=v;if(v>0)pm[p.m]=(pm[p.m]||0)+v}});
 const h=type==='online'?F.chan[channel]:null;
 if(h){o.svc+=c.net*(+h.svc||0)/100;o.adm=(+h.adm||0)*ratio;o.ship=(+h.ship||0)*ratio}
 Object.keys(o).forEach(k=>o[k]=Math.round(o[k]));
 o.tot=o.mdr+o.svc+o.adm+o.ship;o.pm={};Object.keys(pm).forEach(k=>o.pm[k]=Math.round(pm[k]));return o;
}

  let v=cand.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).find(x=>!used.has(x));

 const up=(x,st)=>(Math.floor(x/st)+1)*st,set=new Set();

function mkFmt(paper){
 const W=(paper||db.settings.paper)==='80'?48:32;
 const wrap=s=>{const o=[];let l='';for(const w of String(s).split(/\s+/)){if(!w)continue;if((l+' '+w).trim().length>W){if(l)o.push(l);l=w}else l=(l+' '+w).trim()}if(l)o.push(l);return o};
 return{W,wrap,hr:'-'.repeat(W),
  c:s=>wrap(s).map(x=>' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x).join('\n'),
  lr:(l,r)=>{l=String(l);r=String(r);const sp=W-l.length-r.length;return sp>0?l+' '.repeat(sp)+r:l+'\n'+' '.repeat(Math.max(0,W-r.length))+r}};
}

const RC_SZ=[['n','Normal'],['b','Tebal'],['l','Besar'],['lb','Besar tebal']],RC_AL=[['c','Tengah'],['l','Kiri'],['r','Kanan']];

function rcGet(){
 if(window._rcPrev)return window._rcPrev;
 const r=db.settings.rc||{},d=rcDef();
 const o={hdr:Array.isArray(r.hdr)?r.hdr:d.hdr,ftr:Array.isArray(r.ftr)?r.ftr:d.ftr,cashier:r.cashier!==false,type:r.type!==false,totalBold:!!r.totalBold,logo:r.logo||null,logoSrc:r.logoSrc||'',logoSize:r.logoSize||'m',logoMode:r.logoMode||'t'};
 if(!Array.isArray(r.hdr)&&r.nameStyle)o.hdr[0].s={bold:'b',big:'lb'}[r.nameStyle]||'n';
 return o;
}
function rcTok(x){const st=db.settings;return String(x).replace(/\{nama\}/g,st.name||'').replace(/\{alamat\}/g,st.address||'').replace(/\{wa\}/g,st.wa||'').replace(/\{footer\}/g,st.footer||'')}
function rcLine(f,ln){
 const big=ln.s==='l'||ln.s==='lb',bold=ln.s==='b'||ln.s==='lb',W=big?Math.floor(f.W/2):f.W,al=ln.a||'c';
 const o=[];let l='';
 for(const w of rcTok(ln.t||'').split(/\s+/).filter(Boolean)){if((l+' '+w).trim().length>W){if(l)o.push(l);l=w}else l=(l+' '+w).trim()}
 if(l)o.push(l);
 if(!o.length)return '';
 const pad=x=>al==='c'?' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x:al==='r'?' '.repeat(Math.max(0,W-x.length))+x:x;
 return(bold?'\x02':'')+(big?'\x04':'')+o.map(pad).join('\n')+(big?'\x05':'')+(bold?'\x03':'');
}
const rcFoot=f=>rcGet().ftr.map(l=>rcLine(f,l));
function head(f,title){const RC=rcGet();return[...(RC.logo&&title!=='LAPORAN TUTUP KASIR (Z)'?['\x06']:[]),...RC.hdr.map(l=>rcLine(f,l)),...(title?[f.hr,f.c(title)]:[]),f.hr]}

  if(t.status==='void')L.push(c('*** REFUND PENUH ***'))}
 L.push(hr,...rcFoot(f));
 return L.join('\n');
}

function rcBitmap(img,wDots,mode){
 const wD=Math.max(8,Math.round(wDots/8)*8),hD=Math.max(8,Math.min(240,Math.round(img.height*wD/img.width)));
 const c=document.createElement('canvas');c.width=wD;c.height=hD;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,wD,hD);x.drawImage(img,0,0,wD,hD);
 const d=x.getImageData(0,0,wD,hD).data,g=new Float32Array(wD*hD);
 for(let i=0;i<g.length;i++)g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
 const hb=wD/8,out=new Uint8Array(hb*hD);
 for(let y=0;y<hD;y++)for(let xx=0;xx<wD;xx++){
  const i=y*wD+xx,old=g[i],nw=old<(mode==='f'?128:150)?0:255,err=old-nw;
  if(mode==='f'){if(xx+1<wD)g[i+1]+=err*7/16;if(y+1<hD){if(xx>0)g[i+wD-1]+=err*3/16;g[i+wD]+=err*5/16;if(xx+1<wD)g[i+wD+1]+=err*1/16}}
  if(nw===0)out[y*hb+(xx>>3)]|=0x80>>(xx&7);
 }
 let t='';for(let i=0;i<out.length;i+=8192)t+=String.fromCharCode.apply(null,out.subarray(i,i+8192));
 return{w:wD,h:hD,b:btoa(t)};
}

 const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();

 if(p==='7d')return[d0-6*864e5,d0+864e5];

  const m={};Object.keys(r).forEach(k=>{m[String(k).toLowerCase().replace(/[^a-z]/g,'')]=r[k]});
  const g=f=>{for(const a of al[f]){if(m[a]!==undefined&&m[a]!=='')return m[a]}return''};
  const name=String(g('name')).trim();if(!name){skip++;return}
  const o={name,cat:String(g('cat')).trim()||'Umum',unit:String(g('unit')).trim()||'pcs',price:toNum(g('price')),cogs:toNum(g('cogs')),stock:toNum(g('stock')),barcode:String(g('barcode')).trim()};
  if(isNaN(o.price))o.price=0;if(isNaN(o.cogs))o.cogs=0;if(isNaN(o.stock)){o.stock=0;o.notrack=true}else o.notrack=false;
  const vr=String(g('vars')).trim(),tp=String(g('tops')).trim();

  const ex=db.products.find(p=>(o.barcode&&p.barcode===o.barcode)||p.name.toLowerCase()===name.toLowerCase());
  if(ex){['variants','toppings'].forEach(k=>{if(o[k]&&ex[k])o[k].forEach(n=>{const q=ex[k].find(z=>z.name===n.name);if(q){if((q.recipe||[]).length)n.recipe=q.recipe;if(q.rm)n.rm=q.rm}})})}
  if(ex){const os=ex.notrack?0:(+ex.stock||0);Object.assign(ex,o);ex.upd=now;ex.base=ex.stock;if(!ex.notrack)stkQ(ex.id,ex.name,ex.stock-os,'adj');upd++}else{db.products.push({id:uid(),photo:'',variants:[],toppings:[],...o,upd:now,base:o.stock});add++}
 });
 save();setModal('menu');toast(`Import selesai: ${add} baru, ${upd} diperbarui, ${skip} dilewati${bad?', '+bad+' varian/topping tidak valid diabaikan':''}`);

 async function link(p){
  const srv=await p.dev.gatt.connect();
  const list=await srv.getPrimaryServices();
  list.sort((a,b)=>(SERVICES.includes(b.uuid)?1:0)-(SERVICES.includes(a.uuid)?1:0));
  let w=null;
  for(const s of list){const cs=await s.getCharacteristics();w=cs.find(c=>c.properties.write||c.properties.writeWithoutResponse);if(w)break}
  if(!w)throw new Error('Jalur tulis printer tidak ditemukan');
  p.chr=w;
 }
 function reg(dev){
  let p=pool[dev.id];
  if(!p||p.dev!==dev){p={dev,id:dev.id,name:dev.name||'Printer',chr:null,manual:false,w:0};pool[dev.id]=p}
  return p;
 }
 function watch(p){
  if(p.w)return;p.w=1;
  p.dev.addEventListener('gattserverdisconnected',async()=>{
   p.chr=null;refresh();if(p.manual||pool[p.id]!==p)return;
   for(let i=0;i<3&&!isOn(p.id)&&!p.manual;i++){
    await new Promise(r=>setTimeout(r,1500));
    try{await link(p);refresh();toast('Printer '+p.name+' tersambung kembali');return}catch(e){}
   }
   if(!isOn(p.id))toast('Printer '+p.name+' terputus. Buka Pengaturan › Perangkat untuk sambung lagi.');
  });
 }
 async function natConnect(role){

 }

 const enc=new TextEncoder();
 const clean=t=>String(t).replace(/[·•]/g,'-').replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/[^\x20-\x7E\n\x02-\x06]/g,'');
 /* teks struk -> byte printer: penanda gaya diubah jadi perintah ESC/POS standar */
 const encRC=t=>{const s=clean(t)+'\n\n\n\n',o=[];for(const ch of s){const c=ch.charCodeAt(0);if(c===6){const lg=rcGet().logo;if(lg){const raw=atob(lg.b),hb=lg.w/8;o.push(0x1B,0x61,1,0x1D,0x76,0x30,0,hb&255,hb>>8,lg.h&255,lg.h>>8);for(let i=0;i<raw.length;i++)o.push(raw.charCodeAt(i));o.push(0x1B,0x61,0)}}else if(c===2)o.push(0x1B,0x45,1);else if(c===3)o.push(0x1B,0x45,0);else if(c===4)o.push(0x1D,0x21,0x11);else if(c===5)o.push(0x1D,0x21,0);else o.push(c)}o.push(0x1B,0x45,0,0x1D,0x21,0);return Uint8Array.from(o)};
 async function send(p,bytes){
  for(let i=0;i<bytes.length;i+=100){
   const c=bytes.slice(i,i+100);
   if(p.chr.properties.writeWithoutResponse)await p.chr.writeValueWithoutResponse(c);else await p.chr.writeValue(c);
   await new Promise(r=>setTimeout(r,35));
  }
 }
 async function sendText(role,txt,copies){
  if(nat()){
   const body=encRC(txt),one=new Uint8Array(2+body.length);
   one.set([0x1B,0x40],0);one.set(body,2);
   const all=new Uint8Array(one.length*copies);for(let k=0;k<copies;k++)all.set(one,k*one.length);
   await nat().btSend({address:map[role].id,data:b64(all)});
   return;
  }
  const p=pool[map[role].id];
  const body=encRC(txt);
  const all=new Uint8Array(2+body.length);
  all.set([0x1B,0x40],0);all.set(body,2);
  for(let k=0;k<copies;k++)await send(p,all);
 }
 const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
 function makeBytes(txt,copies,cut){
  const body=encRC(txt),parts=[];
  for(let k=0;k<copies;k++){parts.push(new Uint8Array([0x1B,0x40]),body);if(cut)parts.push(new Uint8Array([0x1D,0x56,0x42,0x00]))}
  const o=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let x=0;parts.forEach(p=>{o.set(p,x);x+=p.length});return o;
 }
 const relayURL=()=>cfg.relay.replace(/\/+$/,'');

 const hx=n=>'0x'+(+n||0).toString(16).padStart(4,'0');

  try{const d=await navigator.usb.requestDevice({filters:[]});setUsb(role,{k:'usb',vid:d.vendorId,pid:d.productId,name:(d.productName||'Printer USB')+' ('+hx(d.vendorId)+':'+hx(d.productId)+')'});toast(ROLES[role]+' → '+(d.productName||'printer USB'))}
  catch(e){if(!e||e.name!=='NotFoundError')toast('Gagal memilih printer USB: '+((e&&e.message)||e))}
 }
 async function serPick(role){
  if(nat()){toast('Di aplikasi Android, port COM belum didukung. Pakai Bluetooth atau LAN.');return}
  if(!navigator.serial){toast('Browser/aplikasi ini tidak mendukung Web Serial. Coba "Pilih printer USB", atau pakai dialog cetak browser.');return}
  try{const pt=await navigator.serial.requestPort(),i=pt.getInfo?pt.getInfo():{};setUsb(role,{k:'ser',vid:i.usbVendorId||0,pid:i.usbProductId||0,name:'Port COM'+(i.usbVendorId?' ('+hx(i.usbVendorId)+':'+hx(i.usbProductId)+')':''),baud:((cfg.roles[role]||{}).usb||{}).baud||9600});toast(ROLES[role]+' → port COM')}
  catch(e){if(!e||e.name!=='NotFoundError')toast('Gagal memilih port COM: '+((e&&e.message)||e))}
 }
 function usbClear(role){const c=cfg.roles[role]||{};delete c.usb;saveCfg();CHK[role]=null;refresh()}
 function setBaud(role,v){const c=cfg.roles[role]=cfg.roles[role]||{};if(c.usb){c.usb.baud=parseInt(v)||9600;saveCfg();refresh()}}
 async function usbFind(u){
  if(u.k==='ser'){if(!navigator.serial)return null;const L=await navigator.serial.getPorts();return L.find(x=>{const i=x.getInfo?x.getInfo():{};return(i.usbVendorId||0)===(u.vid||0)&&(i.usbProductId||0)===(u.pid||0)})||null}
  if(!navigator.usb)return null;const L=await navigator.usb.getDevices();return L.find(d=>d.vendorId===u.vid&&d.productId===u.pid)||null;
 }
 async function usbWriteUsb(d,bytes){
  if(!d.opened)await d.open();
  if(d.configuration===null)await d.selectConfiguration(1);
  let ifc=null,ep=null;
  for(const i of d.configuration.interfaces){for(const a of i.alternates){const o=(a.endpoints||[]).find(e=>e.direction==='out'&&e.type==='bulk');if(o&&(!ifc||a.interfaceClass===7)){ifc=i;ep=o}}}
  if(!ep)throw new Error('jalur cetak (endpoint) USB tidak ditemukan');
  if(!ifc.claimed){try{await d.claimInterface(ifc.interfaceNumber)}catch(e){throw new Error('printer dipakai driver Windows, jadi tidak bisa dibuka langsung. Pasang driver WinUSB (Zadig), atau pakai port COM / dialog cetak browser')}}
  for(let i=0;i<bytes.length;i+=4096){const r=await d.transferOut(ep.endpointNumber,bytes.subarray(i,i+4096));if(r&&r.status&&r.status!=='ok')throw new Error('USB: '+r.status)}
 }
 async function usbWriteSer(pt,bytes,baud){
  if(!pt.writable){try{await pt.open({baudRate:baud||9600})}catch(e){if(!pt.writable)throw new Error('port COM tidak bisa dibuka (dipakai aplikasi lain?)')}}
  const w=pt.writable.getWriter();try{await w.write(bytes)}finally{w.releaseLock()}
 }
 async function usbSend(role,txt,copies){
  const c=cfg.roles[role]||{},u=c.usb;
  if(!u)throw new Error('printer USB belum dipilih');
  const dev=await usbFind(u);
  if(!dev)throw new Error('printer USB tidak terdeteksi (colok ulang atau pilih lagi)');
  const bytes=makeBytes(txt,copies,c.cut!==false);
  if(u.k==='ser')await usbWriteSer(dev,bytes,u.baud);else await usbWriteUsb(dev,bytes);
 }
 async function lanSend(role,txt,copies){
  const c=cfg.roles[role]||{};
  if(!c.ip)throw new Error('IP printer belum diisi');
  if(nat()){
   try{await nat().tcpSend({ip:c.ip,port:+c.port||9100,data:b64(makeBytes(txt,copies,c.cut!==false))})}
   catch(e){throw new Error((e&&e.message)||'printer tidak terjangkau (cek IP dan jaringan)')}
   return;
  }
  if(!cfg.relay)throw new Error('alamat relay belum diisi');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  try{
   const r=await fetch(relayURL()+'/print',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ip:c.ip,port:+c.port||9100,data:b64(makeBytes(txt,copies,c.cut!==false))}),signal:ctl.signal});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
  }catch(e){throw new Error(e.name==='AbortError'?'relay tidak merespons':e.message==='Failed to fetch'?'relay tidak terjangkau (cek alamat/jaringan)':e.message)}
  finally{clearTimeout(t)}
 }
 async function ping(){
  if(!cfg.relay){toast('Isi alamat relay dulu');return}
  try{const r=await fetch(relayURL()+'/ping');const j=await r.json();toast(j.ok?'Relay aktif ✓':'Relay tidak valid')}
  catch(e){toast('Relay tidak terjangkau. Cek alamat dan pastikan relay menyala.')}
 }
 /* status sambungan NYATA: dicek dengan mengirim perintah reset printer (2 byte, tidak mencetak apa pun) */
 const PING=()=>new Uint8Array([0x1B,0x40]);
 async function probe(role,say){
  const m=modeOf(role);if(m==='browser'||(CHK[role]&&CHK[role].busy))return;
  const c=cfg.roles[role]||{};
  CHK[role]={busy:1,ts:Date.now(),ok:false};paint();
  let ok=false,msg='';
  try{
   if(m==='lan'){
    if(!c.ip)throw new Error('IP printer belum diisi');
    if(nat())await nat().tcpSend({ip:c.ip,port:+c.port||9100,data:b64(PING())});
    else{
     if(!cfg.relay)throw new Error('alamat relay belum diisi');
     const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
     try{const r=await fetch(relayURL()+'/print',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ip:c.ip,port:+c.port||9100,data:b64(PING())}),signal:ctl.signal});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status))}
     catch(e){throw new Error(e.name==='AbortError'?'relay tidak merespons':e.message==='Failed to fetch'?'relay tidak terjangkau':e.message)}
     finally{clearTimeout(t)}
    }
   }else if(m==='usb'){
    const u=c.usb;if(!u)throw new Error('printer USB belum dipilih');
    if(!(await usbFind(u)))throw new Error('printer USB tidak terdeteksi (colok ulang atau pilih lagi)');
   }else{
    if(!map[role])throw new Error('printer belum dipilih');
    if(nat())await nat().btSend({address:map[role].id,data:b64(PING())});
    else if(!(await ensure(role)))throw new Error('printer Bluetooth terputus');
   }
   ok=true;
  }catch(e){msg=(e&&e.message)||String(e)}
  CHK[role]={ok,ts:Date.now(),msg};
  soft();
  if(say)toast(ROLES[role]+': '+(ok?'tersambung':'tidak terjangkau'+(msg?' ('+String(msg).slice(0,90)+')':'')));
  return ok;
 }
 async function probeAll(force){

  await Promise.all(rs.map(r=>{const c=CHK[r];if(!force&&c&&(c.busy||Date.now()-c.ts<FRESH))return;return probe(r,false)}));
 }

 const roleOf=k=>k==='z'?'receipt':(ROLES[k]?k:'receipt');
 printJobs=async function(jobs){
  const rest=[],done=new Set();
  for(const j of jobs){
   const role=roleOf(j.kind),mode=modeOf(role),copies=Math.max(1,pcfg(j.kind).copies|0);
   if(mode==='lan'){
    try{await lanSend(role,j.txt,copies);done.add(ROLES[role]);CHK[role]={ok:true,ts:Date.now()};paint()}
    catch(e){CHK[role]={ok:false,ts:Date.now(),msg:e.message};paint();toast('Cetak LAN '+ROLES[role]+' gagal: '+e.message+' - memakai cetak biasa');rest.push(j)}
    continue;
   }
   if(mode==='usb'){
    try{await usbSend(role,j.txt,copies);done.add(ROLES[role]);CHK[role]={ok:true,ts:Date.now()};paint()}
    catch(e){CHK[role]={ok:false,ts:Date.now(),msg:e.message};paint();toast('Cetak USB '+ROLES[role]+' gagal: '+e.message+' - memakai cetak biasa');rest.push(j)}
    continue;
   }
   if(mode!=='bt'||!(await ensure(role))){rest.push(j);continue}
   try{await sendText(role,j.txt,copies);done.add(ROLES[role]);CHK[role]={ok:true,ts:Date.now()};paint()}
   catch(e){CHK[role]={ok:false,ts:Date.now(),msg:e.message};paint();toast('Cetak '+ROLES[role]+' gagal: '+e.message+' - memakai cetak biasa');rest.push(j)}
  }
  if(done.size)toast('Dikirim ke printer: '+[...done].join(', '));
  if(rest.length)await origPrint(rest);
 };

/* ===== Varian & Topping (maks. MAXOPT per produk) ===== */
const MAXOPT=20;
function parseOpts(str,what){
 const out=[],seen={};
 const parts=String(str==null?'':str).split(/[\n;|]+/).map(s=>s.trim()).filter(Boolean);
 if(parts.length>MAXOPT)return{err:'Maksimal '+MAXOPT+' '+what+' per produk (sekarang '+parts.length+')'};
 for(const s of parts){
  const a=s.split(':'),name=a[0].trim();
  if(!name)return{err:'Nama '+what+' kosong: "'+s+'"'};
  const price=(a[1]===undefined||a[1].trim()==='')?0:toNum(a[1]);
  const cogs=(a[2]===undefined||a[2].trim()==='')?0:toNum(a[2]);
  if(isNaN(price)||isNaN(cogs))return{err:'Harga '+what+' "'+name+'" tidak valid'};
  const k=name.toLowerCase();
  if(seen[k])return{err:'Nama '+what+' dobel: '+name};
  seen[k]=1;
  out.push({name:name,price:Math.round(price),cogs:Math.round(cogs)});
 }
 return{list:out};
}
function fmtOpts(list,sep){return(list||[]).map(o=>o.name+':'+o.price+(o.cogs?':'+o.cogs:'')).join(sep)}
function optInfo(p){
 const nv=(p.variants||[]).length,nt=(p.toppings||[]).length;
 return((nv||nt)?' · '+[nv?nv+' varian':'',nt?nt+' topping':''].filter(Boolean).join(', '):'')+expInfo(p);
}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

<script>/* ===== Layar Dapur (KDS): tiket dapur tampil di layar, status Baru > Dimasak > Siap ===== */
const KD={open:false,tab:'act',tickets:[],known:null,err:'',tm:null,pl:null,auto:false,busy:false};
function kdsCfg(){const s=db.settings;if(!s.kds)s.kds={on:false,dev:'main',auto:true,snd:true,warn:5,late:10};return s.kds}
const kdsOn=()=>!!(db.settings.kds&&db.settings.kds.on);
const kdsScreen=()=>kdsOn()&&kdsCfg().dev==='screen';
function kdsPrune(){const n=Date.now();db.kds=(db.kds||[]).filter(t=>!((t.st==='done'&&n-(t.ts4||t.ts)>30*60000)||(t.st==='ready'&&n-(t.ts3||t.ts)>3*3600000)||n-t.ts>24*3600000))}
const kdsIs=x=>x.s!=null?x.s:(x.d?2:0);
function kdsSync(lines,ctx,oid){
 if(!kdsOn()||kdsScreen()||!Array.isArray(lines))return;
 const un=lines.map(l=>({l,q:+((+l.qty||0)-(l.ks||0)).toFixed(3)})).filter(x=>x.q>0);
 if(!un.length)return;
 const set=new Set(kitchenItems(un.map(x=>x.l))),its=un.filter(x=>set.has(x.l));
 if(!its.length)return;
 db.kds=db.kds||[];
 const add=its.some(x=>(x.l.ks||0)>0)||!!(oid&&db.kds.some(t=>t.oid===oid));
 db.kds.push({id:uid(),oid:oid||'',ts:Date.now(),table:ctx.table||'',type:ctx.type||'dine',channel:ctx.channel||'',cust:ctx.cust||'',by:ctx.by||'',no:ctx.no||'',add:add,st:'new',items:its.map(x=>({n:x.l.name,q:x.q,note:x.l.note||'',d:0,s:0}))});
 its.forEach(x=>{x.l.ks=x.l.qty});
 kdsPrune();
 if(KD.open)kdsPaint();
}
/* sisi kasir: melayani layar dapur di perangkat lain */
function kdsRemote(b){
 if(!kdsOn()||kdsScreen())return{ok:false,err:'Layar Dapur belum aktif di kasir'};
 if(b.kds==='set')kdsApply(b.id,b.st,true);else if(b.kds==='item')kdsTick(b.id,b.i,true,b.s);
 kdsPrune();return{ok:true,tickets:db.kds||[],ts:Date.now()};
}
function kdsFind(id){return(KD.src()).find(x=>x.id===id)}
KD.src=()=>kdsScreen()?KD.tickets:(db.kds=db.kds||[]);
function kdsLabel(t){return t.table||(t.type==='online'?typeLabel(t.type,t.channel):(t.cust||typeLabel(t.type,t.channel)))}
function kdsRecalc(t){
 if(t.st==='done')return;
 const v=t.items.map(kdsIs),n=Date.now();
 t.st=v.every(x=>x===2)?'ready':v.some(x=>x>0)?'cook':'new';
 if(t.st==='new'){delete t.ts2;delete t.ts3}else if(!t.ts2)t.ts2=n;
 if(t.st==='ready'){if(!t.ts3)t.ts3=n}else delete t.ts3;
}
function kdsApply(id,st,fromRemote){
 const t=kdsFind(id);if(!t)return;const was=t.st;
 if(st==='done'){t.st='done';t.ts4=Date.now()}
 else{
  if(t.st==='done'){t.st='x';delete t.ts4}
  if(st==='cook')t.items.forEach(i=>{if(kdsIs(i)<1)i.s=1;i.d=kdsIs(i)===2?1:0});
  else if(st==='ready')t.items.forEach(i=>{i.s=2;i.d=1});
  else if(st==='new')t.items.forEach(i=>{i.s=0;i.d=0});
  kdsRecalc(t);
 }
 if(!kdsScreen()){save();if(t.st==='ready'&&was!=='ready'&&fromRemote){try{toast('Siap diantar: '+kdsLabel(t));wBeep()}catch(e){}}}
 else kdsSend({kds:'set',id:id,st:st});
 if(KD.open)kdsPaint();
}
function kdsTick(id,i,fromRemote,sv){
 const t=kdsFind(id);if(!t||!t.items[i]||t.st==='done')return;
 const it=t.items[i],was=t.st;
 it.s=sv!=null?+sv:(kdsIs(it)+1)%3;it.d=it.s===2?1:0;kdsRecalc(t);
 if(!kdsScreen()){save();if(t.st==='ready'&&was!=='ready'&&fromRemote){try{toast('Siap diantar: '+kdsLabel(t));wBeep()}catch(e){}}}
 else kdsSend({kds:'item',id:id,i:i,s:it.s});
 if(KD.open&&!fromRemote)kdsPaint();
}
function kdsSend(b){
 if(!kdsScreen())return;
 const n=wNat();if(!n||!W.ip)return;
 wReq('order',b,6000).then(r=>{if(r&&r.ok&&r.tickets){KD.tickets=r.tickets;KD.err='';if(KD.open)kdsPaint()}}).catch(e=>{KD.err=e.message||'Gagal mengirim'});
}
/* cari kasir otomatis di Wi-Fi (diam-diam, dicoba ulang tiap ~8 detik selama belum tersambung) */
async function kdsCariKasir(){

 try{
  const r=await n.lanScan({port:W.port,key:wKey()}),h=r.hosts||[];
  if(h.length){const ip=h.indexOf(W.ip)>=0?W.ip:h[0];W.ip=ip;try{localStorage.setItem('twinspos_wip',ip)}catch(e){}KD.err=''}
  else KD.err='Kasir belum ditemukan. Pastikan satu Wi-Fi dan Layar Dapur sudah Aktif di kasir.';
 }catch(e){}

}
function kdsPull(){

 KD.busy=true;
 wReq('order',{kds:'list'},5000).then(r=>{if(r&&r.ok){KD.tickets=r.tickets||[];KD.err=''}else{KD.err=(r&&r.err)||'Kasir menolak';kdsCariKasir()}}).catch(e=>{KD.err='Kasir tidak terjangkau, mencari ulang…';kdsCariKasir()}).then(()=>{KD.busy=false;if(KD.open)kdsPaint()});
}
function kdsAge(t){return Math.max(0,Math.floor((Date.now()-t.ts)/60000))}
function kdsLvl(t){const c=kdsCfg(),a=kdsAge(t);return(t.st==='ready'||t.st==='done')?'':a>=(+c.late||10)?' late':a>=(+c.warn||5)?' warn':''}
const KDN={new:'ORDER MASUK',cook:'MULAI MASAK',ready:'SIAP ANTAR',done:'SELESAI'},KDI=['BELUM','DIMASAK','SIAP'];
function kdsCard(t){
 const lv=kdsLvl(t),st=t.st,B={new:['Mulai masak semua','cook'],cook:['Semua siap diantar','ready'],ready:['Sudah diantar','done'],done:['Kembalikan','ready']}[st]||['Mulai masak semua','cook'];
 return`<div class="kdc ${st}${lv}"><div class="kdch"><b>${esc(kdsLabel(t))}</b><span class="kdtm">${st==='ready'?'Siap':st==='done'?'Selesai':kdsAge(t)+' mnt'}</span></div>
 <div class="kdcs"><span class="kdbd ${st}">${KDN[st]}</span>${kdsLabel(t)===typeLabel(t.type,t.channel)?'':esc(typeLabel(t.type,t.channel))+' · '}${t.by?esc(t.by):''}${t.no?' · '+esc(t.no):''}${t.add?' <em>TAMBAHAN</em>':''} · ${fmtT(t.ts).slice(-5)}</div>
 <div class="kdci">${t.items.map((x,i)=>{const v=kdsIs(x);return`<div class="kdi s${v}" onclick="kdsTick('${t.id}',${i})"><span class="kdq">${fq(x.q)}×</span><span class="kdn">${esc(x.n)}${x.note?`<small>&gt;&gt; ${esc(x.note)}</small>`:''}</span><span class="kdsb">${KDI[v]}</span></div>`}).join('')}</div>
 <button class="btn big kdb-${B[1]}" onclick="kdsApply('${t.id}','${B[1]}')">${B[0]}</button></div>`;
}
function kdsHdHTML(){
 const all=KD.src(),cnt={all:all.filter(t=>t.st!=='done').length};['new','cook','ready','done'].forEach(k=>cnt[k]=all.filter(t=>t.st===k).length);
 const stat=kdsScreen()?(KD.err?`<span class="kdst bad">${esc(KD.err)}</span>`:`<span class="kdst ok">Tersambung ke kasir</span>`):`<span class="kdst ok">Perangkat kasir</span>`;
 return`<div class="kdh"><b>Layar Dapur</b>${stat}
 <div class="kdr">${kdsScreen()&&!W.ip?`<button class="btn sm" onclick="wFind().then(()=>kdsPull())">Cari kasir</button>`:''}<button class="btn sm" onclick="kdsCfg().snd=!kdsCfg().snd;save();kdsPaint()">Bunyi: ${kdsCfg().snd?'Hidup':'Mati'}</button><button class="btn sm" onclick="kdsClose()">Tutup</button></div></div>
 <div class="kdtl">${[['all','Semua aktif'],['new','Order masuk'],['cook','Mulai masak'],['ready','Siap antar'],['done','Selesai']].map(([k,l])=>`<button class="k-${k}${KD.tab===k?' on':''}" onclick="KD.tab='${k}';kdsPaint()"><b>${cnt[k]}</b><span>${l}</span></button>`).join('')}</div>`;
}
function kdsPaintHd(){const h=document.getElementById('kdsh');if(h)h.innerHTML=kdsHdHTML()}
function kdsPaint(){
 const el=document.getElementById('kds');if(!el)return;
 const all=KD.src(),ids=new Set(all.map(t=>t.id));
 if(KD.known&&kdsCfg().snd){let nw=false;all.forEach(t=>{if(!KD.known.has(t.id)&&t.st==='new')nw=true});if(nw){try{wBeep();setTimeout(wBeep,300)}catch(e){}}}
 KD.known=ids;
 if(!['all','new','cook','ready','done'].includes(KD.tab))KD.tab='all';
 const list=all.filter(t=>KD.tab==='all'?t.st!=='done':t.st===KD.tab).sort((a,b)=>KD.tab==='done'?(b.ts4||0)-(a.ts4||0):a.ts-b.ts);
 kdsPaintHd();
 const g=document.getElementById('kdsg'),sc=g.scrollTop;
 g.innerHTML=list.length?list.map(kdsCard).join(''):`<div class="kdem">${KD.tab==='all'?'Belum ada pesanan masuk':'Tidak ada pesanan di tahap ini'}</div>`;
 g.scrollTop=sc;
}

function kdsCardSet(){
 const c=kdsCfg(),n=NAT0(),scr=c.dev==='screen';
 const st=!c.on?'Nonaktif.':scr?(wNat()?(W.ip?'Layar terpisah. Kasir: '+W.ip:'Layar terpisah. Kasir belum ditemukan, tekan "Cari kasir" di layar Dapur.'):'Layar terpisah hanya bisa di aplikasi APK.'):'Aktif di perangkat kasir. Tiket aktif: '+(db.kds||[]).filter(t=>t.st!=='done').length+'.';
 return card('Layar Dapur','Tiket dapur tampil di layar lengkap dengan timer. Empat tahap: Order masuk, Mulai masak, Siap antar, Selesai. Tiap menu bisa ditekan untuk status Belum, Dimasak, Siap.',
 `<div class="fg">${fld('Layar Dapur',`<select id="k_on">${selOpt(c.on,[[true,'Aktif'],[false,'Nonaktif']])}</select>`)}${fld('Fungsi perangkat ini',`<select id="k_dev">${selOpt(scr,[[false,'Perangkat kasir (menerima pesanan)'],[true,'Layar Dapur terpisah (tablet di dapur)']])}</select>`)}
 ${fld('Bunyi saat pesanan baru',`<select id="k_snd">${selOpt(c.snd!==false,[[true,'Hidup'],[false,'Mati']])}</select>`)}${fld('Buka layar otomatis setelah login',`<select id="k_auto">${selOpt(c.auto!==false,[[true,'Ya (untuk tablet dapur)'],[false,'Tidak']])}</select>`)}
 ${fld('Peringatan kuning (menit)',`<input id="k_w" type="number" min="1" value="${+c.warn||5}">`)}${fld('Peringatan merah (menit)',`<input id="k_l" type="number" min="1" value="${+c.late||10}">`)}</div>
 <div id="k_st" class="mut" style="margin:10px 0;font-size:13.5px">${esc(st)}</div>
 <div class="quick"><button class="btn pri" onclick="kdsSave()">Simpan</button><button class="btn" onclick="kdsSave(true)">Simpan &amp; buka layar</button></div>
 <div class="mut" style="font-size:12.5px;margin-top:10px">Cara pasang layar di dapur: (1) di kasir, cukup hidupkan <b>Layar Dapur: Aktif</b> dan pilih <b>Perangkat kasir</b>, lalu simpan. Tidak perlu mengaktifkan Pesanan Pelayan. (2) Di tablet dapur (APK, Kode Toko sama, satu Wi-Fi), login, pilih <b>Layar Dapur terpisah</b>, simpan, lalu tekan Cari kasir. Pada satu perangkat saja, tombol Dapur di bagian atas membuka layar yang sama.</div>`)
}
function kdsSave(open){
 const c=kdsCfg();
 c.on=document.getElementById('k_on').value==='true';c.dev=document.getElementById('k_dev').value==='true'?'screen':'main';
 c.snd=document.getElementById('k_snd').value==='true';c.auto=document.getElementById('k_auto').value==='true';
 c.warn=Math.max(1,+document.getElementById('k_w').value||5);c.late=Math.max(c.warn+1,+document.getElementById('k_l').value||10);
 save();toast('Tersimpan');
 try{if(lanNeeded())wSrvStart();else wSrvStop()}catch(e){}
 try{renderMain()}catch(e){}
 if(open&&c.on){closeModal();setTimeout(kdsOpen,150)}else setModal('kds');
}
